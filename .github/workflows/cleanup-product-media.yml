name: Crop screenshot photos and restore Lipstick sweatshirt media
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-media-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Upload and verify supplied product media
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: python
        run: |
          import os, pathlib, shutil, subprocess
          bundle = pathlib.Path('backups/pineneedledesigns.website/media-cleanup/2026-11-07')
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pine-recovery'
          temporary.mkdir(mode=0o700)
          identity = temporary / 'identity'
          identity.write_text(os.environ['SSH_PRIVATE_KEY'] + '\n')
          identity.chmod(0o600)
          options = ['-i', str(identity), '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=yes', '-o', 'HostKeyAlias=pineneedles-production', '-o', 'UserKnownHostsFile=scripts/catalog-monitor.known_hosts']
          import json
          for media in json.loads((bundle / 'manifest.json').read_text())['files']:
              source = pathlib.Path('backups/pineneedledesigns.website/site/uploads') / media['path']
              destination = temporary / 'uploads' / media['path']
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
          host = os.environ['DO_USER'] + '@' + os.environ['DO_HOST']
          subprocess.run(['ssh', *options, host, 'mkdir -p /tmp/pine-media-cleanup-20261107'], check=True)
          subprocess.run(['scp', *options, '-r', str(temporary / 'uploads'), str(bundle / 'manifest.json'), str(bundle / 'apply.mjs'), host + ':/tmp/pine-media-cleanup-20261107/'], check=True)
          code = (bundle / 'apply.mjs').read_text()
          subprocess.run(['ssh', *options, host, 'cd /root/pineneedledesigns.website && node --input-type=module'], input=code, text=True, check=True)
          subprocess.run(['ssh', *options, host, 'rm -rf /tmp/pine-media-cleanup-20261107'], check=True)
