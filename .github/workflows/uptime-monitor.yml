name: External Uptime Monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send a confirmation email
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: external-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore previous notification state
        uses: actions/cache/restore@v5
        with:
          path: .uptime-state
          key: uptime-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uptime-state-v1-
      - name: Check website and send outage or recovery email
        run: node scripts/uptime-monitor.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email || 'false' }}
      - name: Save state even if the website or email service is down
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .uptime-state
          key: uptime-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
